# Compile l'app Coffre (dossier coffre/) et publie l'APK en artefact téléchargeable.
# L'APK produit ici est signé avec une clé de debug éphémère : pour tester.
# Pour l'usage quotidien, construire sur son PC avec sa propre clé (voir coffre/README.md).
name: Coffre – APK

on:
  push:
    paths:
      - 'coffre/**'
      - '!coffre/**/*.md'
      - '.github/workflows/coffre-apk.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: coffre
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.5'
          channel: stable
          cache: true

      - name: Dépendances
        run: flutter pub get

      - name: Analyse statique
        run: flutter analyze

      - name: Tests
        run: flutter test

      - name: APK release (arm64, Galaxy S26 Ultra)
        run: flutter build apk --release --target-platform android-arm64

      - name: Vérifications de l'APK
        run: |
          APK=build/app/outputs/flutter-apk/app-release.apk
          AAPT2=$(ls "$ANDROID_HOME"/build-tools/*/aapt2 | sort -V | tail -1)
          echo "== Permissions"
          "$AAPT2" dump permissions "$APK" | tee perms.txt
          if grep -q "android.permission.INTERNET" perms.txt; then
            echo "ERREUR : la permission INTERNET est présente"; exit 1
          fi
          echo "== Bibliothèques natives"
          unzip -l "$APK" | grep "\.so$" | tee libs.txt
          grep -qi "sqlite" libs.txt || { echo "ERREUR : bibliothèque SQLite absente"; exit 1; }
          echo "== Taille"
          ls -lh "$APK"

      - uses: actions/upload-artifact@v4
        with:
          name: coffre-apk
          path: coffre/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 14
