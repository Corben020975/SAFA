<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0E4A31">
<title>SAFA Terrain</title>
<link rel="manifest" href="manifest.json">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600;700&family=Fraunces:opsz,wght@9..144,700;9..144,800&display=swap" rel="stylesheet">
<style>
:root{--bg:#F4F3EE;--card:#fff;--primary:#1B6B4A;--pl:#E8F5EE;--pd:#0E4A31;--accent:#D4853A;--danger:#C0392B;--dl:#FDECEA;--text:#1A1A1A;--ts:#5A6A5E;--border:#D8DDD9;--sh:0 1px 3px rgba(0,0,0,.06),0 4px 12px rgba(0,0,0,.04);--shl:0 4px 24px rgba(0,0,0,.1);--r:14px;--rs:8px;--f:'DM Sans',sans-serif;--fd:'Fraunces',serif;--maf:#1B6B4A;--mams:#2E5FA1;--mrep:#B5541B}
*{margin:0;padding:0;box-sizing:border-box}
html,body{font-family:var(--f);background:var(--bg);color:var(--text);-webkit-font-smoothing:antialiased;overflow-x:hidden;touch-action:manipulation}
input,select,textarea,button{font-family:var(--f);font-size:15px}
.app{max-width:480px;margin:0 auto;min-height:100dvh;position:relative;padding-bottom:env(safe-area-inset-bottom)}
.pin-screen{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100dvh;padding:40px 20px;text-align:center}
.pin-title{font-family:var(--fd);font-size:28px;color:var(--pd);margin-top:12px}
.pin-sub{color:var(--ts);font-size:14px;margin-top:4px}
.pin-error{color:var(--danger);font-size:13px;margin-top:8px;min-height:20px}
.pin-dots{display:flex;gap:14px;margin:20px 0}
.pin-dot{width:18px;height:18px;border-radius:50%;border:2.5px solid var(--border);transition:all .2s}
.pin-dot.filled{background:var(--primary);border-color:var(--primary);transform:scale(1.1)}
.pin-pad{display:grid;grid-template-columns:repeat(3,72px);gap:12px}
.pin-key{width:72px;height:72px;border-radius:50%;border:1.5px solid var(--border);background:var(--card);font-size:24px;font-weight:500;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .12s;-webkit-tap-highlight-color:transparent}
.pin-key:active{background:var(--pl);transform:scale(.94)}
.pin-key.empty{border:none;background:transparent}
.header{position:sticky;top:0;z-index:100;padding:14px 20px;display:flex;align-items:center;gap:12px;backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);background:rgba(244,243,238,.85);border-bottom:1px solid var(--border)}
.hback{width:38px;height:38px;border-radius:50%;border:none;background:var(--card);box-shadow:var(--sh);display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:18px;color:var(--text);-webkit-tap-highlight-color:transparent;transition:transform .12s}
.hback:active{transform:scale(.9)}
.htitle{font-family:var(--fd);font-size:19px;font-weight:700;flex:1}
.badge{font-size:11px;font-weight:600;padding:4px 10px;border-radius:20px;text-transform:uppercase;letter-spacing:.5px}
.badge.af{background:var(--pl);color:var(--primary)}.badge.ams{background:#E3EDF7;color:#2E5FA1}.badge.repas{background:#FFF0E3;color:#B5541B}
.home{padding:24px 20px}.logo{text-align:center;margin-bottom:32px;padding-top:16px}
.logo h1{font-family:var(--fd);font-size:34px;color:var(--pd);letter-spacing:-1px}
.logo p{color:var(--ts);font-size:14px;margin-top:2px}
.lock-badge{display:inline-flex;align-items:center;gap:6px;margin-top:10px;font-size:12px;color:var(--ts);background:var(--pl);padding:5px 14px;border-radius:20px}
.mcards{display:flex;flex-direction:column;gap:14px}
.mcard{background:var(--card);border-radius:var(--r);padding:22px;box-shadow:var(--sh);cursor:pointer;border-left:5px solid;position:relative;transition:transform .12s;-webkit-tap-highlight-color:transparent}
.mcard:active{transform:scale(.98)}
.mcard.af{border-left-color:var(--maf)}.mcard.ams{border-left-color:var(--mams)}.mcard.repas{border-left-color:var(--mrep)}
.mcard-icon{font-size:28px;margin-bottom:10px}
.mcard h3{font-size:17px;font-weight:600;margin-bottom:3px}
.mcard p{font-size:13px;color:var(--ts);line-height:1.4}
.mcard-count{position:absolute;top:18px;right:18px;font-size:11px;font-weight:600;padding:3px 10px;border-radius:20px;background:var(--bg)}
.slink{text-align:center;margin-top:20px;font-size:13px;color:var(--ts);cursor:pointer;padding:10px}
.dlist{padding:16px 20px;padding-bottom:100px}
.dempty{text-align:center;padding:60px 20px;color:var(--ts)}
.dempty-icon{font-size:48px;margin-bottom:12px;opacity:.4}
.ditem{background:var(--card);border-radius:var(--rs);padding:14px 16px;margin-bottom:10px;box-shadow:var(--sh);display:flex;align-items:center;gap:12px;cursor:pointer;transition:transform .12s;-webkit-tap-highlight-color:transparent}
.ditem:active{transform:scale(.98)}
.ditem-info{flex:1}.ditem-name{font-weight:600;font-size:15px}.ditem-date{font-size:12px;color:var(--ts);margin-top:2px}
.ditem-del{width:34px;height:34px;border-radius:8px;border:none;background:var(--dl);color:var(--danger);cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:16px}
.fab{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);max-width:440px;width:calc(100% - 40px);padding:15px;border-radius:var(--r);border:none;font-size:16px;font-weight:600;color:#fff;cursor:pointer;box-shadow:var(--shl);display:flex;align-items:center;justify-content:center;gap:8px;z-index:50;-webkit-tap-highlight-color:transparent;transition:transform .12s}
.fab:active{transform:translateX(-50%) scale(.97)}
.fab.af{background:var(--maf)}.fab.ams{background:var(--mams)}.fab.repas{background:var(--mrep)}
.fview{padding:16px 20px 120px}
.steps{display:flex;gap:4px;margin-bottom:20px}
.sdot{flex:1;height:4px;border-radius:2px;background:var(--border);transition:background .3s}
.sdot.active{background:var(--primary)}.sdot.done{background:var(--primary);opacity:.5}
.ftitle{font-family:var(--fd);font-size:21px;font-weight:700;margin-bottom:4px}
.fsub{font-size:13px;color:var(--ts);margin-bottom:18px;line-height:1.4}
.field{margin-bottom:14px}.flabel{font-size:13px;font-weight:600;color:var(--ts);margin-bottom:5px;display:block}
.finput{width:100%;padding:11px 14px;border:1.5px solid var(--border);border-radius:var(--rs);font-size:15px;background:var(--card);transition:border-color .2s;outline:none;-webkit-appearance:none;color:var(--text)}
.finput:focus{border-color:var(--primary)}.finput::placeholder{color:#B0B8B2}
.frow{display:flex;gap:10px}.frow .field{flex:1}
.ftextarea{min-height:90px;resize:vertical}
.chips{display:flex;flex-wrap:wrap;gap:7px}
.chip{padding:8px 14px;border-radius:20px;border:1.5px solid var(--border);background:var(--card);font-size:13px;cursor:pointer;transition:all .15s;-webkit-tap-highlight-color:transparent;user-select:none}
.chip.sel{background:var(--pl);border-color:var(--primary);color:var(--primary);font-weight:600}
.clist{display:flex;flex-direction:column;gap:7px}
.citem{display:flex;align-items:center;gap:10px;padding:10px 14px;border-radius:var(--rs);background:var(--card);border:1.5px solid var(--border);cursor:pointer;font-size:14px;transition:all .15s;-webkit-tap-highlight-color:transparent;user-select:none}
.citem.chk{border-color:var(--primary);background:var(--pl)}
.cbox{width:22px;height:22px;border-radius:6px;border:2px solid var(--border);display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:all .15s;font-size:13px;color:#fff}
.citem.chk .cbox{background:var(--primary);border-color:var(--primary)}
.memcard{background:var(--card);border-radius:var(--rs);border:1.5px solid var(--border);padding:14px;margin-bottom:10px}
.memhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.memtitle{font-weight:600;font-size:14px}
.memdel{border:none;background:none;color:var(--danger);cursor:pointer;font-size:18px;padding:4px}
.addbtn{width:100%;padding:12px;border:2px dashed var(--border);border-radius:var(--rs);background:transparent;cursor:pointer;font-size:14px;color:var(--ts);display:flex;align-items:center;justify-content:center;gap:6px;transition:all .15s;-webkit-tap-highlight-color:transparent}
.addbtn:active{border-color:var(--primary);color:var(--primary)}
.fnav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);max-width:480px;width:100%;padding:14px 20px;padding-bottom:calc(14px + env(safe-area-inset-bottom));background:rgba(244,243,238,.92);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-top:1px solid var(--border);display:flex;gap:10px;z-index:50}
.btn{flex:1;padding:13px;border-radius:var(--rs);border:none;font-size:15px;font-weight:600;cursor:pointer;transition:all .12s;-webkit-tap-highlight-color:transparent}
.btn:active{transform:scale(.97)}
.btn-sec{background:var(--card);color:var(--text);border:1.5px solid var(--border)}
.btn-pri{background:var(--primary);color:#fff}.btn-acc{background:var(--accent);color:#fff}.btn-danger{background:var(--danger);color:#fff}
.rcard{background:var(--card);border-radius:var(--r);padding:24px;box-shadow:var(--shl);margin-bottom:16px;text-align:center}
.ramount{font-family:var(--fd);font-size:40px;font-weight:800;color:var(--primary)}
.rlabel{font-size:13px;color:var(--ts);margin-top:2px}
.rdetails{margin-top:16px;padding-top:16px;border-top:1px solid var(--border);text-align:left}
.rrow{display:flex;justify-content:space-between;padding:5px 0;font-size:14px}
.rrow-l{color:var(--ts)}.rrow-v{font-weight:600}
.ssec{background:var(--card);border-radius:var(--rs);padding:16px;margin-bottom:12px;box-shadow:var(--sh)}
.ssec h4{font-size:12px;text-transform:uppercase;letter-spacing:.5px;color:var(--ts);margin-bottom:8px}
.srow{display:flex;justify-content:space-between;padding:3px 0;font-size:14px}
.srow span:first-child{color:var(--ts)}.srow span:last-child{font-weight:500}
.stags{display:flex;flex-wrap:wrap;gap:5px;margin-top:6px}
.stag{padding:4px 10px;border-radius:12px;font-size:12px;font-weight:500;background:var(--pl);color:var(--primary)}
.rcards2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.rcard2{padding:18px 12px;border-radius:var(--r);border:2px solid var(--border);background:var(--card);cursor:pointer;text-align:center;transition:all .15s;-webkit-tap-highlight-color:transparent}
.rcard2.sel{border-color:var(--mrep);background:#FFF0E3}
.rcard2-icon{font-size:28px;margin-bottom:4px}.rcard2-label{font-size:13px;font-weight:600}
.day-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.day-btn{padding:12px 4px;border-radius:var(--rs);border:1.5px solid var(--border);background:var(--card);cursor:pointer;text-align:center;font-size:13px;font-weight:500;transition:all .15s;-webkit-tap-highlight-color:transparent}
.day-btn.sel{background:#FFF0E3;border-color:var(--mrep);color:var(--mrep);font-weight:700}
.exbtn{width:100%;padding:14px;border-radius:var(--rs);border:1.5px solid var(--border);background:var(--card);cursor:pointer;font-size:14px;display:flex;align-items:center;gap:10px;transition:all .12s;margin-top:10px;-webkit-tap-highlight-color:transparent}
.exbtn:active{transform:scale(.98)}
.toast{position:fixed;top:80px;left:50%;transform:translateX(-50%);padding:12px 20px;border-radius:var(--rs);background:var(--pd);color:#fff;font-size:14px;font-weight:500;box-shadow:var(--shl);z-index:200;animation:tin .3s ease,tout .3s ease 2.2s forwards;white-space:nowrap}
@keyframes tin{from{opacity:0;transform:translateX(-50%) translateY(-10px)}}
@keyframes tout{to{opacity:0;transform:translateX(-50%) translateY(-10px)}}
@keyframes fu{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
.fadein{animation:fu .35s ease}
.spage{padding:24px 20px}.spage h2{font-family:var(--fd);font-size:22px;margin-bottom:20px}
.sitem{background:var(--card);border-radius:var(--rs);padding:16px;margin-bottom:12px;box-shadow:var(--sh)}
.sitem h4{font-size:14px;margin-bottom:4px}.sitem p{font-size:13px;color:var(--ts);line-height:1.4}
</style>
</head>
<body>
<div class="app" id="app"></div>
<script>
var REVENUE_TYPES=[{id:"1",l:"Pension retraite/survie"},{id:"2",l:"Revenu travail"},{id:"3",l:"RIS / CPAS"},{id:"4",l:"Aucun revenu"},{id:"5",l:"Indemnité maladie/handicap/APA"},{id:"6",l:"Chômage"},{id:"7",l:"Autres réguliers (loyers, rentes)"},{id:"8",l:"Autres"}];
var SITUATIONS=["Isolé(e)","Famille monoparentale","Couple sans enfant","Couple avec enfant(s)","Cohab. gén. diff.","Cohab. mêmes gén.","Autre"];
var LIMITATIONS=["Se déplacer","Se nourrir","Hygiène personnelle","Hygiène habitat/linge","Vivre seul","Communiquer","Gestion administrative","Gestion familiale"];
var DEMANDE_PAR=["Bénéficiaire","Famille","Médecin","Coordination","Hôpital","Mutuelle","MR","CPAS","ONE","SAJ/SPJ","AWIPH","Autres"];
var PLAN_SECTIONS=[
{t:"Aide vie quotidienne",k:"vie",items:["Déplacement int.","Déplacement ext.","Courses","Entretien pièces","Linge/repassage","Aide lever","Aide coucher","Surveillance sécurité"]},
{t:"Repas",k:"repas",items:["Préparation repas","Aide prise repas","Régime alimentaire","Distribution repas"]},
{t:"Rôle sanitaire",k:"sanit",items:["Toilette/habillement","Protection/continence","Prise médicaments","Accomp. médical"]},
{t:"Aide relationnelle",k:"relat",items:["Identification difficultés","Soutien/dialogue","Soutien fin de vie"]},
{t:"Rôle éducatif",k:"educ",items:["Accomp. éducatif enfant","Conseils hygiène vie","Soutien rôle éducatif","Stimulation potentialités","Aide scolaire"]},
{t:"Aide sociale/admin.",k:"social",items:["Démarches admin./budget","Orientation services","Intégration sociale"]}];
var AMS_TACHES=["Entretien sols","Nettoyage cuisine","Nettoyage sanitaires","Dépoussiérage","Vitres","Lessive","Repassage","Courses","Préparation repas","Rangement"];
var REGIMES=[{l:"Normal",i:"🍽️"},{l:"Sans sel",i:"🧂"},{l:"Diabète",i:"💉"},{l:"Mouliné",i:"🥣"}];
var JOURS=["Lundi","Mardi","Mercredi","Jeudi","Vendredi","Samedi","Dimanche"];
var FK=["Médecin","Hospitalisation","Infirmier","Kiné","Médicaments","Incontinence","Location matériel","Biotélévigilance"];
var RK=["MAF","Ass. hospitalisation","Forfait incontinence","Autres assurances"];
var BAR=[[0,100,0,0,0],[100.01,200,.5,.5,.5],[200.01,300,.75,.5,.5],[300.01,400,1,.75,.5],[400.01,500,1.25,1,.75],[500.01,600,1.5,1.25,1],[600.01,700,1.75,1.5,1.25],[700.01,800,2,1.75,1.5],[800.01,900,2.5,2,1.75],[900.01,1000,3,2.5,2],[1000.01,1100,3.5,3,2.5],[1100.01,1200,4,3.5,3],[1200.01,1300,4.5,4,3.5],[1300.01,1400,5,4.5,4],[1400.01,1500,5.5,5,4.5],[1500.01,1600,6,5.5,5],[1600.01,1700,6.5,6,5.5],[1700.01,1800,7,6.5,6],[1800.01,1900,7.31,7,6.5],[1900.01,2000,7.81,7.31,7],[2000.01,Infinity,7.81,7.81,7.31]];
var LS={g:function(k){try{var d=localStorage.getItem('safa_'+k);return d?JSON.parse(d):null}catch(e){return null}},s:function(k,v){try{localStorage.setItem('safa_'+k,JSON.stringify(v))}catch(e){}},ds:function(m){return(LS.g('dossiers')||[]).filter(function(d){return d.module===m})},sv:function(d){var a=LS.g('dossiers')||[];var i=a.findIndex(function(x){return x.id===d.id});if(i>=0)a[i]=d;else a.push(d);LS.s('dossiers',a)},dl:function(id){LS.s('dossiers',(LS.g('dossiers')||[]).filter(function(d){return d.id!==id}))}};
function hp(p){var h=5381;for(var i=0;i<p.length;i++){h=((h<<5)+h)+p.charCodeAt(i);h=h&0x7FFFFFFF}return'PH'+h.toString(36)}
var S={screen:'pin',module:null,step:0,form:{},pf:0};
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,6)}
document.addEventListener('visibilitychange',function(){if(document.hidden&&S.screen!=='pin'){S.screen='pin';render()}});
function rl(id){var t=REVENUE_TYPES.find(function(r){return r.id===id});return t?t.l:(id||'?')}
function cF(f){var tb=0;(f.revenusBen||[]).forEach(function(r){tb+=parseFloat(r.montant)||0});var tm=0;(f.membres||[]).forEach(function(m){var mr=0;(m.revenus||[]).forEach(function(r){mr+=parseFloat(r.montant)||0});tm+=(m.lien==='conjoint'?mr:mr/3)});var pa=parseFloat(f.pensionAlim)||0;var tr=tb+tm;var ch=f.charges||{};var tFr=0;FK.forEach(function(k){tFr+=parseFloat(ch[k])||0});var tRe=0;RK.forEach(function(k){tRe+=parseFloat(ch['r_'+k])||0});var cd=Math.max(0,tFr/12-tRe/12);var rn=Math.max(0,tr-cd-pa);var code=1,hc=(f.membres||[]).some(function(m){return m.lien==='conjoint'});var bh=f.handicap==='Reconnu'&&parseInt(f.handicapPct)>=66;var en=(f.membres||[]).filter(function(m){return m.aCharge}).length;if(hc||(bh&&!hc&&en===0))code=2;if(en>0)code=2+en;(f.membres||[]).forEach(function(m){if(m.handicapGrave&&m.lien!=='conjoint')code+=2});code=Math.max(1,code);var ci=code>=3?2:code-1;var co=7.81;for(var i=0;i<BAR.length;i++){var b=BAR[i];if(rn>=b[0]&&rn<=b[1]){co=b[2+ci];break}}var dp=+(co*0.10).toFixed(2);var ct=Math.max(0,+(co+dp-0.40).toFixed(2));return{tb:tb,tm:tm,tr:tr,pa:pa,tFr:tFr,tRe:tRe,cd:cd,rn:rn,code:code,co:co,dp:dp,ct:ct}}
function $(id){return document.getElementById(id)}
function app(){return document.getElementById('app')}
function toast(m){var t=document.createElement('div');t.className='toast';t.textContent=m;document.body.appendChild(t);setTimeout(function(){t.remove()},2800)}
function render(){if(S.screen==='pin')rPin();else if(S.screen==='home')rHome();else if(S.screen==='list')rList();else if(S.screen==='form')rForm();else if(S.screen==='settings')rSet()}
function sy(){document.querySelectorAll('[data-field]').forEach(function(el){S.form[el.dataset.field]=el.value})}
function inp(f,l,t,p){t=t||'text';p=p||'';var v=S.form[f]||'';return '<div class="field"><label class="flabel">'+l+'</label><input class="finput" data-field="'+f+'" type="'+t+'" value="'+v+'" placeholder="'+p+'" oninput="S.form[\''+f+'\']=this.value"></div>'}
function txta(f,l,p){p=p||'';var v=S.form[f]||'';return '<div class="field"><label class="flabel">'+l+'</label><textarea class="finput ftextarea" data-field="'+f+'" placeholder="'+p+'" oninput="S.form[\''+f+'\']=this.value">'+v+'</textarea></div>'}
function chips(f,o,mu){var c=S.form[f];var ca=Array.isArray(c)?c:[];return '<div class="chips">'+o.map(function(x){var s=mu?ca.indexOf(x)>=0:c===x;return '<div class="chip'+(s?' sel':'')+'" onclick="tC(\''+f+'\',\''+x.replace(/'/g,"\\'")+'\','+!!mu+')">'+x+'</div>'}).join('')+'</div>'}
function checks(f,o){var a=Array.isArray(S.form[f])?S.form[f]:[];return '<div class="clist">'+o.map(function(x){var c=a.indexOf(x)>=0;return '<div class="citem'+(c?' chk':'')+'" onclick="tC(\''+f+'\',\''+x.replace(/'/g,"\\'")+'\',true)"><div class="cbox">'+(c?'✓':'')+'</div><span>'+x+'</span></div>'}).join('')+'</div>'}
window.tC=function(f,v,mu){sy();if(mu){var a=Array.isArray(S.form[f])?S.form[f].slice():[];var i=a.indexOf(v);if(i>=0)a.splice(i,1);else a.push(v);S.form[f]=a}else S.form[f]=v;render()};
